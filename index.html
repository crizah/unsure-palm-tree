  { name:"Feeding India – Bangalore",             city:"Bangalore", type:"NGO",      area:"Citywide",         address:"Multiple distribution points",                                            timings:"Event-based", cost:"Free" },
];

let activeCity = "all";
let activeType = "all";
let searchQuery = "";

function render() {
  const filtered = places.filter(p => {
    const cityOk = activeCity === "all" || p.city === activeCity;
    const typeOk = activeType === "all" || p.type === activeType;
    const q = searchQuery.toLowerCase();
    const textOk = !q || p.name.toLowerCase().includes(q) || p.area.toLowerCase().includes(q) || p.address.toLowerCase().includes(q);
    return cityOk && typeOk && textOk;
  });

  document.getElementById("stats").textContent =
    `Showing ${filtered.length} of ${places.length} locations`;

  document.getElementById("grid").innerHTML = filtered.map(p => `
    <div class="card">
      <div class="card-header">
        <h2>${p.name}</h2>
        <span class="badge ${p.type}">${p.type}</span>
      </div>
      <div class="meta">
        <span class="addr">${p.address}</span>
        <span class="time">${p.timings}</span>
        <span class="cost">${p.cost}</span>
        <span class="city-tag">${p.city}</span>
      </div>
    </div>
  `).join("");
}

document.getElementById("city-filters").addEventListener("click", e => {
  const btn = e.target.closest("[data-city]");
  if (!btn) return;
  activeCity = btn.dataset.city;
  document.querySelectorAll("[data-city]").forEach(b =>
    b.classList.toggle("active", b.dataset.city === activeCity));
  render();
});

document.getElementById("type-filters").addEventListener("click", e => {
  const btn = e.target.closest("[data-type]");
  if (!btn) return;
  activeType = btn.dataset.type;
  document.querySelectorAll("[data-type]").forEach(b =>
    b.classList.toggle("active", b.dataset.type === activeType));
  render();
});

document.getElementById("search").addEventListener("input", e => {
  searchQuery = e.target.value;
  render();
});

render();
</script>
</body>
</html>
